name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info makes the HelixDB test binaries several GB each.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # The embedded HelixDB engine must not send telemetry from CI.
  HELIX_TELEMETRY_LEVEL: "off"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # memst-lib's tests embed Python through PyO3 0.22, which supports
      # Python up to 3.13; the runner's default is newer.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # memst-py is a Python extension module: its test binary cannot link
      # without libpython, and the "python bindings" job builds and tests it
      # properly, through maturin.
      - name: Test
        run: cargo test --workspace --exclude memst-py --locked

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: memst-core, native search only
        run: cargo check --locked -p memst-core --no-default-features --features native-backend
      - name: memst-core, tantivy search only
        run: cargo check --locked -p memst-core --no-default-features --features tantivy-backend
      - name: memst-cli without HelixDB
        run: cargo check --locked -p memst-cli --no-default-features

  python:
    name: python bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Run maturin from memst-py: at the repo root it would pick up the
      # root pyproject.toml, which belongs to the benchmark scripts.
      - name: Build and install the extension
        working-directory: memst-py
        run: |
          python -m pip install maturin pytest
          maturin build --release --out ../dist
          python -m pip install ../dist/*.whl
      - name: Test
        run: python -m pytest memst-py/tests -q

[package]
name = "memst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
memst-core = { path = "../memst-core" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"

[package]
name = "memst-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
memst-core = { path = "../memst-core" }
memst-graph-helix = { path = "../memst-graph-helix", optional = true }
memst-embed = { path = "../memst-embed", optional = true }
memst-sleep = { path = "../memst-sleep" }
memst-mcp = { path = "../memst-mcp" }
memst-repo = { path = "../memst-repo" }
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.6", features = ["v4"] }
serde_json = "1.0"
chrono = "0.4"

[features]
# `helix` compiles the embedded HelixDB engine into the CLI and makes it the
# default graph backend. Build with `--no-default-features` for a small binary
# that only knows graph.json.
default = ["helix", "local-embeddings"]
helix = ["dep:memst-graph-helix"]
# `local-embeddings` compiles in ONNX Runtime and the BGE-M3 loader, so
# entities can be embedded on the CPU with no embedding API.
local-embeddings = ["dep:memst-embed"]

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

# The README and manual call the binary `memst`.
[[bin]]
name = "memst"
path = "src/main.rs"

[package]
name = "memst-graph-helix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HelixDB (embedded graph + vector + BM25 database) backend for the MemSt knowledge graph"

[dependencies]
memst-core = { path = "../memst-core" }

# HelixDB, embedded: the engine runs inside this process, no server needed.
# crates.io `helix-db` 3.0.0 is the HTTP client only and has no `embedded`
# feature, so the engine is built from the fork, pinned to an exact commit.
# Bump `rev` deliberately; see docs/graph-backend-helix.md.
helix-db = { git = "https://github.com/yfyang86/helix-db", rev = "26c3f138d0fe849260d16b9ddf838b9a35154d19", features = ["embedded"] }

tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1.0"
chrono = "0.4"
uuid = "1.6"

[dev-dependencies]
tempfile = "3.8"

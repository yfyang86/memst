[package]
name = "memst-py"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"

[lib]
name = "memst"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# MemSt core
memst-core = { path = "../memst-core", default-features = false }

# KG Extraction v2 (use SQLite backend for Python bindings)
memst-extract-v2 = { path = "../memst-extract-v2", default-features = true }

# Optional dependencies for memst-core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread"] }

[features]
default = ["native-backend"]
native-backend = ["memst-core/native-backend"]
tantivy-backend = ["memst-core/tantivy-backend"]

[profile.release]
lto = true
opt-level = 3

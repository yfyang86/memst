[project]
name = "memst-server"
version = "0.1.1"
description = "MemSt Python API Server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "duckdb>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "toml>=0.10.2",
    "../third/nanobot",
]

[project.scripts]
memst-server = "memst_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling"

[package]
name = "memst-sleep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Async sleep-time consolidation pipeline for MemSt"

[dependencies]
memst-core = { path = "../memst-core" }
memst-repo = { path = "../memst-repo" }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full", "time"] }
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP client for LLM calls during consolidation
reqwest = { version = "0.11", features = ["json"] }

# Clustering for memory grouping
# kmeans = "0.11"  # Temporarily disabled due to dependency issues

# Queue/priority queue for job scheduling
# priority-queue = "2.0"  # Temporarily disabled

[dev-dependencies]
tokio-test = "0.4"

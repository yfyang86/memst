[package]
name = "memst-extract-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Advanced Knowledge Graph extraction with DuckDB backend"

[features]
default = ["sqlite"]  # Use SQLite by default for easier development
duckdb = ["dep:duckdb", "dep:libduckdb-sys"]
sqlite = ["dep:rusqlite"]

[dependencies]
memst-core = { path = "../memst-core" }

# Storage backends (choose one)
# DuckDB - High-performance OLAP database (requires C++ build tools)
duckdb = { version = "0.10", features = ["bundled"], optional = true }
libduckdb-sys = { version = "0.10", optional = true }

# SQLite - Lightweight alternative for development
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid", "serde_json"], optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
dashmap = "5.5"
parking_lot = "0.12"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# LLM integration
async-openai = "0.18"

# Time - pinned for compatibility
chrono = { version = "0.4.31", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Regex
regex = "1.10"

# String similarity for entity linking
strsim = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"

[[example]]
name = "basic_extraction"
path = "examples/basic_extraction.rs"
required-features = ["sqlite"]

[workspace]
members = [
    "memst-core",
    "memst-cli",
    "memst-py",
    "memst-lib",
    "memst-repo",
    "memst-sleep",
    "memst-mcp",
    "memst-extract-v2",
    "memst-graph-helix",
    "memst-embed",
]
# Everything under apps/ (web server, React UI, Tauri desktop shell) is
# deliberately outside the Rust workspace. See apps/README.md.
exclude = [
    "apps",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.93"
authors = ["Yifan Yang <yfyang.86@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/yfyang86/memst"
description = "Git-like memory architecture for LLM session management"

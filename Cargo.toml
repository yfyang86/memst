[workspace]
members = [
    "memst-core",
    "memst-cli",
    "memst-py",
    "memst-lib",
    "memst-repo",
    "memst-sleep",
    "memst-mcp",
    "memst-extract-v2",
]
exclude = [
    "memst-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.93"
authors = ["Yifan Yang <yfyang.86@hotmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/yfyang86/memst"
description = "Git-like memory architecture for LLM session management"

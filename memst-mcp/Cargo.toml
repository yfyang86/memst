[package]
name = "memst-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP (Model Context Protocol) adapter for MemSt"

[dependencies]
memst-core = { path = "../memst-core" }
memst-repo = { path = "../memst-repo" }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async runtime
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP server for MCP endpoints (disabled for now)
# axum = "0.7"
# tower = "0.5"
# tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio-test = "0.4"

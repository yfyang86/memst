[package]
name = "memst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

# Hashing
blake3 = "1.5"
sha2 = "0.10"

# Compression
zstd = "0.13"

# File operations
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3.8"
fs2 = "0.4"
dirs = "5"

# Collections
indexmap = { version = "2.2", features = ["serde"] }

# Graph storage
petgraph = "0.6"

# HTTP client for LLM/Embedding APIs
reqwest = { version = "0.11", features = ["json"] }

# Async trait for extractor trait
async-trait = "0.1"

# Async runtime for tests
futures = "0.3"

# Random for HNSW vector index
rand = { version = "0.8", features = ["std", "small_rng", "getrandom"] }

# Optional: Full-text search with Tantivy 0.25+ (requires Rust 1.88+)
tantivy = { version = "0.25", optional = true, default-features = false, features = ["mmap", "lz4-compression"] }

[features]
# Enable Tantivy full-text search backend (requires Rust 1.88+)
tantivy-backend = ["tantivy"]

# Enable native Rust inverted index (no external dependencies)
native-backend = []

# Default: both backends available
default = ["native-backend", "tantivy-backend"]

[dev-dependencies]
# Async runtime for integration tests
tokio = { version = "1", features = ["full"] }

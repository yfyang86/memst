# MemSt configuration example.
# Copy to ./config.toml, <store>/config.toml or ~/.config/memst/config.toml,
# or point MEMST_CONFIG_PATH at it. Environment variables override nothing
# here; they are only used when no config file is found
# (MEMST_LLM_API_URL, MEMST_EMBEDDING_API_URL, MEMST_EMBEDDING_MODEL).

[llm]
# Provider type: openai, claude, lmstudio, ollama
type = "openai"
# OpenAI-compatible endpoint
api_url = "http://127.0.0.1:1234/v1"
model = "your-model-name"
timeout = 60
max_tokens = 4096
temperature = 0.7
# Leave empty for local servers. Do not commit a real key.
api_key = ""

[embedding]
type = "openai"
# Base URL or the full .../embeddings endpoint
api_url = "http://127.0.0.1:1234/v1"
model = "bge-m3"
timeout = 30
# Optional: checked against what the endpoint returns
expected_dimension = 1024
